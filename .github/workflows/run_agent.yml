name: Run Data Agent

on:
  schedule:
    - cron: '0 18 * * 1-5'   # Werktags 18:00 Uhr UTC
  workflow_dispatch:          # erlaubt manuellen Start per Klick

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Agent ausführen
        run: python data_agent.py

      - name: Ergebnisse committen
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/*.csv
          git commit -m "Automatisches Update der Marktdaten" || echo "Keine Änderungen"
          git push
